<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBIT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="grid-content" style="max-width: 900px;">
        <div>
          <figure>
            <i data-lucide="factory"></i>
          </figure>
          <p>Manufaktur</p>
        </div>

        <div>
          <figure>
            <i data-lucide="truck"></i>
          </figure>
          <p>Distribusi</p>
        </div>

        <div>
          <figure>
            <i data-lucide="shopping-cart"></i>
          </figure>
          <p>Retail</p>
        </div>

        <div>
          <figure>
            <i data-lucide="package"></i>
          </figure>
          <p>Logistik</p>
        </div>

        <div>
          <figure>
            <i data-lucide="landmark"></i>
          </figure>
          <p>Keuangan</p>
        </div>

        <div>
          <figure>
            <i data-lucide="heart-pulse"></i>
          </figure>
          <p>Kesehatan</p>
        </div>

        <div>
          <figure>
            <i data-lucide="graduation-cap"></i>
          </figure>
          <p>Pendidikan</p>
        </div>

        <div>
          <figure>
            <i data-lucide="grid-3x3"></i>
          </figure>
          <p>Lainnya</p>
        </div>
      </article>
      <section></section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
